name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            keytool -genkeypair -v \
              -keystore release.jks \
              -storepass antidroid-ci \
              -keypass antidroid-ci \
              -alias antidroid \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AntiDroid, OU=CI, O=AntiDroid, L=GitHub, ST=CI, C=US"
            printf "storeFile=release.jks\nstorePassword=antidroid-ci\nkeyAlias=antidroid\nkeyPassword=antidroid-ci\n" \
              > keystore.properties
          fi

      - name: Build signed release APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk AntiDroid.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiDroid-APK
          path: AntiDroid.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AntiDroid.apk
          generate_release_notes: true
